<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>CyberTrace — Don't Just Learn. Investigate.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    /* =========================================================
       CYBERTRACE
       Modern SOC Investigation UI
       ========================================================= */

    :root {
      --bg: #070b14;
      --bg-soft: #0a101d;

      --panel: #0f1626;
      --panel-2: #121c30;
      --panel-3: #0c1423;

      --line: #25324d;
      --line-soft: #1a263d;

      --text: #e8eefc;
      --muted: #8b9bbd;

      --cyan: #3ad1ff;
      --cyan-soft: rgba(58, 209, 255, 0.10);
      --cyan-glow: rgba(58, 209, 255, 0.20);

      --success: #2ee59d;
      --success-soft: rgba(46, 229, 157, 0.10);

      --warning: #ffb020;
      --warning-soft: rgba(255, 176, 32, 0.10);

      --danger: #ff3b5c;
      --danger-soft: rgba(255, 59, 92, 0.10);

      --shadow: 0 12px 35px rgba(0, 0, 0, 0.22);

      --radius: 14px;
      --radius-sm: 10px;

      --sans:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      --mono:
        "JetBrains Mono",
        monospace;

      color-scheme: dark;
      box-sizing: border-box;
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
    }

    html {
      scroll-padding-top: 80px;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(58, 209, 255, 0.08),
          transparent 38%
        ),
        var(--bg);
      color: var(--text);
      font: 16px/1.65 var(--sans);
    }

    button,
    select,
    textarea {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background: rgba(58, 209, 255, 0.25);
    }

    /* =========================================================
       APP SHELL
       ========================================================= */

    .app {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
    }

    aside {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      padding: 24px 14px;
      border-inline-end: 1px solid var(--line);
      background: rgba(7, 11, 20, 0.78);
      backdrop-filter: blur(14px);
      z-index: 10;
    }

    .brand {
      padding: 4px 10px 22px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      color: var(--text);
      font: 800 19px/1 var(--mono);
      letter-spacing: 0.4px;
    }

    .logo-mark {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: var(--cyan);
      box-shadow: 0 0 18px var(--cyan-glow);
    }

    .brand small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      letter-spacing: 0.7px;
      text-transform: uppercase;
    }

    #nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #nav button {
      all: unset;
      width: 100%;
      box-sizing: border-box;
      cursor: pointer;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 9px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      transition:
        background 0.18s ease,
        color 0.18s ease,
        border-color 0.18s ease;
    }

    #nav button:hover:not(:disabled) {
      background: var(--panel);
      color: var(--text);
      border-color: var(--line-soft);
    }

    #nav button.on {
      color: var(--cyan);
      background: var(--cyan-soft);
      border-color: rgba(58, 209, 255, 0.18);
      box-shadow: inset 3px 0 0 var(--cyan);
    }

    #nav button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* =========================================================
       MAIN
       ========================================================= */

    main {
      min-width: 0;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 30px 80px;
    }

    h1,
    h2,
    h3 {
      color: var(--text);
      letter-spacing: -0.02em;
    }

    h1 {
      margin: 0.2em 0 0.35em;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.12;
    }

    h2 {
      margin: 0.2em 0 0.45em;
      font-size: 24px;
      line-height: 1.25;
    }

    h3 {
      margin: 0;
      font-size: 17px;
    }

    p {
      margin-top: 0.5em;
    }

    .m {
      color: var(--muted);
      margin: 0.35em 0 1.1em;
    }

    .hero {
      padding: 30px 0 12px;
    }

    .hero h1 {
      max-width: 760px;
    }

    .hero-copy {
      max-width: 680px;
      color: var(--muted);
      font-size: 17px;
    }

    /* =========================================================
       HUD
       ========================================================= */

    #hud {
      position: sticky;
      top: 0;
      z-index: 20;

      width: 100%;

      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;

      padding: 10px 20px;

      background: rgba(7, 11, 20, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .hl {
      color: var(--cyan);
      font: 700 14px var(--mono);
      letter-spacing: 1px;
    }

    .stp {
      display: flex;
      flex: 1;
      min-width: 0;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stp::-webkit-scrollbar {
      display: none;
    }

    .st {
      flex: 0 0 auto;

      padding: 6px 10px;

      border: 1px solid var(--line);
      border-radius: 7px;

      background: transparent;
      color: var(--muted);

      cursor: pointer;

      font: 600 11px var(--mono);
      white-space: nowrap;

      transition:
        color 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;
    }

    .st:hover:not(:disabled) {
      color: var(--text);
      border-color: #3a4968;
    }

    .st.cur {
      color: var(--cyan);
      border-color: var(--cyan);
      background: var(--cyan-soft);
      box-shadow: 0 0 14px rgba(58, 209, 255, 0.08);
    }

    .st.dn {
      color: var(--success);
      border-color: rgba(46, 229, 157, 0.35);
    }

    .st:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .mt {
      min-width: 72px;
      text-align: right;
    }

    .mt small {
      display: block;
      color: var(--muted);
      font: 600 10px var(--mono);
      letter-spacing: 0.5px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      padding: 4px 9px;

      border: 1px solid currentColor;
      border-radius: 999px;

      font: 700 10px/1 var(--sans);
      letter-spacing: 0.7px;
    }

    .sound-btn {
      min-width: 36px;
      padding: 7px 9px;
    }

    .pr {
      flex-basis: 100%;
      display: flex;
      align-items: center;
      gap: 10px;

      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
    }

    .pr .bar {
      flex: 1;
      margin: 0;
      height: 5px;
    }

    /* =========================================================
       PROGRESS / BARS
       ========================================================= */

    .bar {
      width: 100%;
      height: 8px;

      overflow: hidden;

      background: var(--line-soft);
      border-radius: 999px;
    }

    .bar i {
      display: block;
      height: 100%;
      background: var(--cyan);
      border-radius: inherit;
      transition: width 0.35s ease;
    }

    /* =========================================================
       CARDS
       ========================================================= */

    .card {
      display: block;

      margin: 12px 0;
      padding: 17px 18px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.015),
          transparent
        ),
        var(--panel);

      border: 1px solid var(--line);
      border-radius: var(--radius);

      box-shadow: 0 2px 0 rgba(255, 255, 255, 0.01);

      transition:
        border-color 0.18s ease,
        transform 0.18s ease,
        box-shadow 0.18s ease;
    }

    .card:hover {
      border-color: #344565;
    }

    .card.okb {
      border-color: rgba(46, 229, 157, 0.45);
      background:
        linear-gradient(
          135deg,
          rgba(46, 229, 157, 0.045),
          transparent
        ),
        var(--panel);
    }

    .card.badb {
      border-color: rgba(255, 59, 92, 0.45);
      background:
        linear-gradient(
          135deg,
          rgba(255, 59, 92, 0.045),
          transparent
        ),
        var(--panel);
    }

    .card.dng {
      border-color: rgba(255, 59, 92, 0.55);
      box-shadow: 0 0 20px rgba(255, 59, 92, 0.07);
    }

    .card.sfe {
      border-color: rgba(46, 229, 157, 0.42);
    }

    .card.wnc {
      border-color: rgba(255, 176, 32, 0.50);
      background:
        linear-gradient(
          135deg,
          rgba(255, 176, 32, 0.045),
          transparent
        ),
        var(--panel);
    }

    /* =========================================================
       MAYA
       ========================================================= */

    .maya {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin: 0 0 20px;
    }

    .maya i {
      flex: none;

      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: var(--cyan);
      color: var(--bg);

      font: 800 15px var(--sans);

      box-shadow: 0 0 18px rgba(58, 209, 255, 0.12);
    }

    .maya div {
      flex: 1;

      padding: 10px 14px;

      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px 14px 14px 14px;
    }

    .maya small {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* =========================================================
       STATUS / LABELS
       ========================================================= */

    .siren {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 5px 10px;

      border: 1px solid rgba(255, 59, 92, 0.35);
      border-radius: 999px;

      background: var(--danger-soft);
      color: #ff7189;

      font: 700 10px var(--mono);
      letter-spacing: 0.8px;
    }

    .t {
      color: var(--cyan);
      font: 700 12px var(--mono);
      letter-spacing: 0.4px;
    }

    .ok {
      color: var(--success);
    }

    .bad {
      color: var(--danger);
    }

    .warning {
      color: var(--warning);
    }

    /* =========================================================
       BUTTONS
       ========================================================= */

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 0;
    }

    .ev,
    .b,
    .go {
      font: inherit;
      cursor: pointer;
    }

    .ev,
    .b {
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);

      transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        background 0.15s ease;
    }

    .b {
      padding: 8px 13px;
      font-size: 13px;
    }

    .b:hover:not(:disabled),
    .ev:hover:not(:disabled) {
      border-color: #3a4968;
      background: var(--panel-2);
    }

    .b.sel,
    .ev.sel {
      color: var(--cyan);
      border-color: var(--cyan);
      background: var(--cyan-soft);
    }

    .ev {
      padding: 12px 14px;
      text-align: start;
    }

    .ev.wide {
      display: block;
      width: 100%;
      margin: 8px 0;
    }

    .ev .et {
      display: block;
      font-weight: 700;
    }

    .ev small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .ev.seen {
      border-style: dashed;
    }

    .ev.okb {
      border-color: rgba(46, 229, 157, 0.55);
    }

    .ev.badb {
      border-color: rgba(255, 59, 92, 0.55);
    }

    .ev em {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      font-style: normal;
    }

    .go {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      margin-top: 15px;
      padding: 12px 18px;

      color: #041019;
      background: var(--cyan);

      border: 1px solid var(--cyan);
      border-radius: var(--radius-sm);

      font-weight: 800;

      transition:
        transform 0.15s ease,
        filter 0.15s ease;
    }

    .go:hover:not(:disabled) {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    button:disabled {
      opacity: 0.48;
      cursor: default;
    }

    button:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    /* =========================================================
       GRID
       ========================================================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
      );
      gap: 10px;
    }

    /* =========================================================
       LOG / TERMINAL WINDOWS
       ========================================================= */

    .win {
      margin: 14px 0;

      overflow: hidden;

      background: var(--panel-3);
      border: 1px solid var(--line);
      border-radius: var(--radius);

      box-shadow: var(--shadow);
    }

    .win > * {
      padding-left: 16px;
      padding-right: 16px;
    }

    .wb {
      display: flex;
      align-items: center;
      gap: 5px;

      padding-top: 9px !important;
      padding-bottom: 9px !important;

      background: var(--panel-2);
      border-bottom: 1px solid var(--line);

      color: var(--muted);

      font: 600 11px var(--mono);
    }

    .wb i {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .wb i:first-child {
      background: var(--danger);
    }

    .wb i:nth-child(2) {
      background: var(--warning);
    }

    .tm {
      color: var(--cyan);
    }

    pre {
      margin: 7px 0;

      white-space: pre-wrap;
      word-break: break-word;

      color: #c9d4e9;

      font: 12px/1.7 var(--mono);
      text-align: left;
      direction: ltr;
    }

    /* =========================================================
       EVIDENCE LINES
       ========================================================= */

    .ln {
      display: block;

      padding: 3px 8px;

      border-left: 3px solid transparent;
      border-radius: 3px;

      cursor: pointer;

      transition:
        background 0.15s ease,
        border-color 0.15s ease;
    }

    .ln:hover {
      background: rgba(255, 255, 255, 0.025);
    }

    .ln.fl {
      background: var(--warning-soft);
      border-color: var(--warning);
    }

    .ln.okl {
      background: var(--success-soft);
      border-color: var(--success);
    }

    .ln.badl {
      background: var(--danger-soft);
      border-color: var(--danger);
      text-decoration: line-through;
      opacity: 0.75;
    }

    .ln.miss {
      border-color: var(--danger);
      border-style: dashed;
    }

    /* =========================================================
       CHAIN / CONNECT THE CLUES
       ========================================================= */

    .chain {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;

      margin: 0 0 18px;
      padding: 12px;

      background: var(--panel-3);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .nd {
      padding: 6px 10px;

      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;

      font-size: 12px;
      font-weight: 600;
    }

    .lk {
      color: var(--muted);
      font-weight: 800;
    }

    .lk.wn {
      color: var(--warning);
    }

    .lk.ok {
      color: var(--success);
    }

    .lk.bad {
      color: var(--danger);
    }

    /* =========================================================
       TIMELINE
       ========================================================= */

    .tl {
      display: grid;
      grid-template-columns: 70px 1fr auto;
      gap: 13px;
      align-items: center;

      cursor: grab;
    }

    .tl:active {
      cursor: grabbing;
    }

    .tl > span:nth-child(2) {
      min-width: 0;
    }

    .ar {
      display: flex;
      gap: 4px;
    }

    .ar .b {
      min-width: 34px;
      padding: 4px 8px;
    }

    /* =========================================================
       HINTS
       ========================================================= */

    .hint {
      margin: 0 0 14px;
    }

    .hint div {
      margin-bottom: 7px;
      padding: 8px 11px;

      background: var(--cyan-soft);
      border-left: 3px solid var(--cyan);
      border-radius: 6px;

      color: #c7dff0;
      font-size: 13px;
    }

    .hint .b {
      background: transparent;
    }

    /* =========================================================
       FORM ELEMENTS
       ========================================================= */

    select,
    textarea {
      width: 100%;

      margin-top: 7px;
      padding: 10px 12px;

      background: var(--bg-soft);
      color: var(--text);

      border: 1px solid var(--line);
      border-radius: 9px;

      font: inherit;
    }

    select {
      cursor: pointer;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    textarea::placeholder {
      color: #5f6d87;
    }

    /* =========================================================
       SCORE
       ========================================================= */

    .xp {
      margin: 8px 0 4px;

      color: var(--cyan);
      font: 800 clamp(42px, 8vw, 60px)/1 var(--mono);

      text-shadow: 0 0 20px rgba(58, 209, 255, 0.12);
    }

    .sc {
      display: flex;
      justify-content: space-between;

      margin-top: 14px;

      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;

      margin: 5px 6px 5px 0;
      padding: 6px 10px;

      border: 1px solid var(--cyan);
      border-radius: 999px;

      color: var(--cyan);
      background: var(--cyan-soft);

      font-size: 12px;
      font-weight: 700;
    }

    .badge.off {
      opacity: 0.35;
      color: var(--muted);
      border-color: var(--line);
      background: transparent;
    }

    /* =========================================================
       LEGEND
       ========================================================= */

    .lg {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;

      margin: 0 0 12px;

      color: var(--muted);
      font-size: 12px;
    }

    .d {
      display: inline-block;

      width: 9px;
      height: 9px;

      margin-inline-end: 5px;

      border-radius: 50%;
    }

    .d.r {
      background: var(--danger);
    }

    .d.a {
      background: var(--warning);
    }

    .d.g {
      background: var(--success);
    }

    /* =========================================================
       SPLASH
       ========================================================= */

    #splash {
      position: relative;
      z-index: 50;
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(
          circle,
          rgba(58, 209, 255, 0.08),
          transparent 35%
        ),
        #070b14;

      text-align: center;

      animation: splashInOut 1.5s forwards;
    }

    .splash small {
      display: block;

      margin-bottom: 12px;

      color: var(--muted);

      font: 700 11px var(--mono);
      letter-spacing: 4px;
    }

    .splash b {
      display: block;

      color: var(--cyan);

      font: 800 clamp(38px, 9vw, 76px)/1 var(--mono);

      text-shadow:
        0 0 24px rgba(58, 209, 255, 0.35);
    }

    .splash span {
      display: block;
      margin-top: 12px;
      color: var(--muted);
    }

    @keyframes splashInOut {
      0% {
        opacity: 0;
      }

      12% {
        opacity: 1;
      }

      80% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* =========================================================
       SHAKE
       ========================================================= */

    @media (prefers-reduced-motion: no-preference) {
      .shk main {
        animation: shake 0.35s;
      }

      @keyframes shake {
        20% {
          transform: translateX(-6px);
        }

        40% {
          transform: translateX(6px);
        }

        60% {
          transform: translateX(-4px);
        }

        80% {
          transform: translateX(4px);
        }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        position: sticky;
        top: 0;

        width: 100%;
        height: auto;

        padding: 10px 12px;

        border-inline-end: 0;
        border-bottom: 1px solid var(--line);
      }

      .brand {

      }

      if (mute) return;

          AC ||
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

        const data = {
          click: [520, 0.05],
          good: [880, 0.20],
          bad: [140, 0.30],
          go: [330, 0.30]
        }[type];

        if (!data) return;

        const oscillator = AC.createOscillator();
        const gain = AC.createGain();

        oscillator.type =
          type === "bad" ? "sawtooth" : "sine";

        oscillator.frequency.value = data[0];

        gain.gain.setValueAtTime(
          0.055,
          AC.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          AC.currentTime + data[1]
        );

        oscillator.connect(gain);
        gain.connect(AC.destination);

        oscillator.start();

        oscillator.stop(
          AC.currentTime + data[1]
        );
      } catch (e) {
        /* Audio is optional. */
      }
    }

        if (E[i].h.includes(j)) {

      return {

              (x, p) => `
                <div
                  class="
                    card tl
                    ${
                      done
                        ? x === p
                          ? "okb"
                          : "badb"
                        : ""
                    }
                  "
                  ${
                    done
                      ? ""
                      : `
                        draggable="true"
                        ondragstart="dg=${p}"
                        ondragover="event.preventDefault()"
                        ondrop="mv(dg,${p})"
                      `
                  }
                >

                  <span class="t">
                    ${
                      done
                        ? T[x].t
                        : `#${p + 1}`
                    }
                  </span>

                  <span>
                    ${esc(T[x].x)}
                  </span>

                  ${
                    done
                      ? x === p
                        ? `
                          <b class="ok">
                            ✔
                          </b>
                        `
                        : `
                          <b class="bad">
                            ✘
                          </b>
                        `
                      : `
                        <span class="ar">

                          <button
                            class="b"
                            onclick="mv(${p},${p - 1})"
                            aria-label="Move up"
                          >
                            ▲
                          </button>

                          <button
                            class="b"
                            onclick="mv(${p},${p + 1})"
                            aria-label="Move down"
                          >
                            ▼
                          </button>

                        </span>
                      `
                  }

                </div>
              `
            )
            .join("")}

          ${
            done
              ? next("attack")
              : `
                <button
                  class="go"
                  onclick="subTl()"
                >
                  Check my order
                </button>
              `
          }
        `;
      },

      /* -------------------------------------------------------
         ATT&CK
         ------------------------------------------------------- */

      attack: () =>
        quiz(
          "attack",
          "🎯 What did the attacker use?",
          "Pick the plain description. The technical concept appears after each answer.",
          "response"
        ),

      /* -------------------------------------------------------
         RESPONSE
         ------------------------------------------------------- */

      response: () => `
        <h2>
          🚨 Incident Response
        </h2>

        <p class="m">
          The attacker may still be inside.
          Choose the actions you would take.
          Think about containment, evidence,
          and business impact.
        </p>

        <div class="card wnc">

          <b>
            Response principle
          </b>

          <p class="m">
            Contain the threat without destroying the evidence
            you still need to understand the incident.
          </p>

        </div>

        ${R
          .map(
            (r, i) => `
              <button
                class="
                  ev wide
                  ${
                    S.resp.has(i)
                      ? "sel"
                      : ""
                  }
                  ${
                    S.done.response &&
                    S.resp.has(i)
                      ? r.p > 0
                        ? "okb"
                        : "badb"
                      : ""
                  }
                "
                ${
                  S.done.response
                    ? "disabled"
                    : ""
                }
                onclick="togR(${i})"
              >

                <b>
                  ${esc(r.n)}
                </b>

                <small>
                  Stops attacker:
                  ${esc(r.s)}
                  ·
                  Disrupts work:
                  ${esc(r.b)}
                  ·
                  Keeps evidence:
                  ${esc(r.e)}
                </small>

                ${
                  S.done.response &&
                  S.resp.has(i)
                    ? `
                      <em>
                        You chose this:
                        ${esc(r.w)}
                      </em>
                    `
                    : ""
                }

              </button>
            `
          )
          .join("")}

        ${
          S.done.response
            ? `
              ${outcome()}

              ${next("report")}
            `
            : `
              <button
                class="go"
                ${
                  S.resp.size
                    ? ""
                    : "disabled"
                }
                onclick="subR()"
              >
                Execute decisions →
              </button>
            `
        }
      `,

      /* -------------------------------------------------------
         REPORT
         ------------------------------------------------------- */

      report: () => `
        <h2>
          📄 Final Incident Report
        </h2>

        <p class="m">
          A good analyst does not just find clues.
          They explain what those clues mean.
        </p>

        ${F
          .map(
            (f, i) => `
              <label class="card">

                <b>
                  ${esc(f.n)}
                </b>

                <select
                  ${
                    S.done.report
                      ? "disabled"
                      : ""
                  }
                  onchange="setRep(${i},this.value)"
                  dir="ltr"
                >

                  <option value="">
                    —
                  </option>

                  ${f.o
                    .map(
                      (o, j) => `
                        <option
                          value="${j}"
                          ${
                            Number(S.rep[i]) === j
                              ? "selected"
                              : ""
                          }
                        >
                          ${esc(o)}
                        </option>
                      `
                    )
                    .join("")}

                </select>

                ${
                  S.done.report
                    ? `
                      <span
                        class="${
                          Number(S.rep[i]) === f.c
                            ? "ok"
                            : "bad"
                        }"
                      >
                        ${
                          Number(S.rep[i]) === f.c
                            ? "✔ Correct"
                            : `✘ Correct answer: ${esc(f.o[f.c])}`
                        }
                      </span>
                    `
                    : ""
                }

              </label>
            `
          )
          .join("")}

        ${reportText()}

        ${
          S.done.report
            ? next("score")
            : `
              <button
                class="go"
                ${
                  Object.keys(S.rep).length <
                  F.length
                    ? "disabled"
                    : ""
                }
                onclick="subRep()"
              >
                Submit report →
              </button>
            `
        }
      `,

      /* -------------------------------------------------------
         SCORE
         ------------------------------------------------------- */

      score: () => {
        const r = S.res;

        const ev =
          r.evidence || 0;

        const cats = [
          ["🔎 Evidence Discovery", ev],
          ["🧩 Alert Triage", r.alerts || 0],
          ["🔗 Connecting Clues", r.clues || 0],
          ["🕐 Timeline", r.timeline || 0],
          ["🎯 ATT&CK Learning", r.attack || 0],
          ["🚨 Response", r.response || 0],
          ["📄 Reporting", r.report || 0]
        ];

        const xp =
          Math.max(
            0,
            Math.round(
              cats.reduce(
                (a, c) => a + c[1],
                0
              ) * 0.65
            ) - S.pen
          );

        let rank = "Rookie";

        if (xp >= 380) {
          rank = "Investigator";
        } else if (xp >= 270) {
          rank = "Analyst";
        }

        const ach = [
          [
            "🕵️ Evidence Hunter",
            ev === 100
          ],

          [
            "🚨 Alert Spotter",
            r.alerts === 100
          ],

          [
            "🕐 Timeline Detective",
            r.timeline === 100
          ],

          [
            "🔗 Connection Maker",
            r.clues === 100
          ],

          [
            "🎯 ATT&CK Learner",
            r.attack === 100
          ],

          [
            "🚨 Incident Responder",
            (r.response || 0) >= 80 &&
            !S.bad
          ]
        ];

        const left =
          V
            .slice(1, 8)
            .filter(([k]) => !S.done[k])
            .length;

        return `
          <h2>
            🏆 Investigation Score
          </h2>

          ${
            left
              ? `
                <div class="card wnc">
                  <b>
                    ${left} stage(s) were not completed.
                  </b>

                  <p class="m">
                    Incomplete stages receive zero points.
                  </p>
                </div>
              `
              : ""
          }

          <div class="card">

            <div class="m">
              CASE #001 · FINAL RESULT
            </div>

            <div class="xp">
              ${xp} XP
            </div>

            <p>
              In-game rank:
              <b>${esc(rank)}</b>
            </p>

            <p class="m">
              XP and ranks represent progress inside
              CyberTrace. They are not a professional
              cybersecurity certification or assessment.
            </p>

          </div>

          <h2>
            Investigation breakdown
          </h2>

          ${cats
            .map(
              ([label, value]) => `
                <div class="sc">
                  <span>${esc(label)}</span>
                  <span>${value}%</span>
                </div>

                ${bar(value)}
              `
            )
            .join("")}

          <h2 style="margin-top:30px">
            🏅 Achievements
          </h2>

          <div>
            ${ach
              .map(
                ([name, unlocked]) => `
                  <span
                    class="badge ${
                      unlocked
                        ? ""
                        : "off"
                    }"
                  >
                    ${esc(name)}
                  </span>
                `
              )
              .join("")}
          </div>

          ${
            S.done.response
              ? outcome()
              : ""
          }

          <div class="card">

            <b>
              🔓 CASE DEBRIEF
            </b>

            <h3 style="margin-top:14px">
              What actually happened?
            </h3>

            <ol>

              <li>
                <b>Initial access:</b>
                a phishing email tricked Sarah into
                typing her password on a fake page.
              </li>

              <li>
                <b>Account compromise:</b>
                the attacker used her stolen password
                to log in from an unfamiliar location.
              </li>

              <li>
                <b>Endpoint activity:</b>
                a hidden PowerShell command ran
                on WS-042.
              </li>

              <li>
                <b>Command and control:</b>
                WS-042 began repeatedly contacting
                a suspicious outside server.
              </li>

              <li>
                <b>Data transfer:</b>
                1.8 GB left the network through
                the suspicious connection.
              </li>

            </ol>

            <div
              class="card"
              style="margin-top:18px"
            >
              <b>
                💡 The big idea
              </b>

              <p class="m">
                A suspicious login by itself might not tell
                you the whole story. A phishing email,
                an unusual login, endpoint activity,
                a suspicious server, and a large data transfer
                become much more meaningful when you connect them.
              </p>
            </div>

            <p class="m">
              This is a fictional training scenario inspired
              by common real-world attack patterns.
            </p>

            <p class="m">
              CyberTrace ranks show in-game progress,
              not professional skill or certification.
            </p>

          </div>

          <button
            class="go"
            onclick="
              S=mk();
              draw();
            "
          >
            Play Case #001 Again ↻
          </button>
        `;
      }
    };

    /* =========================================================
       DRAW
       ========================================================= */

    function draw(keep = false) {

      /*
       * The original prototype rendered the game inside #main
       * but did not render the sidebar navigation.
       * We now keep both navigation systems synchronized.
       */

      $("#hud").style.display =
        S.v === "home"
          ? "none"
          : "flex";

      $("#hud").innerHTML =
        S.v === "home"
          ? ""
          : hud();

      $("#splash").innerHTML =
        S.sp
          ? splash()
          : "";

      $("#main").innerHTML =
        maya() +
        hintBox() +
        P[S.v]() +
        notesBox();

      renderNav();

      if (!keep) {
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      }
    }

    function renderNav() {
      const nav = $("#nav");

      if (S.v === "home") {
        nav.innerHTML = `
          <button
            class="on"
            onclick="go('home')"
          >
            Home
          </button>
        `;

        return;
      }

      nav.innerHTML = V.map(
        ([k, label], i) => `
          <button
            class="${S.v === k ? "on" : ""}"
            ${i > S.max ? "disabled" : ""}
            onclick="go('${k}')"
          >
            ${
              i > S.max
                ? "🔒 "
                : ""
            }
            ${esc(label)}
          </button>
        `
      ).join("");
    }

    /* =========================================================
       START
       ========================================================= */

    draw();
  </script>

</body>
</html>
